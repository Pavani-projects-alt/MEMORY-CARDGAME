<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Match!</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800&display=swap');

  :root {
    --bg: #1a1a2e;
    --panel: #16213e;
    --accent: #e94560;
    --gold: #f5a623;
    --green: #4ecca3;
    --card-back: #0f3460;
    --card-front: #ffffff;
    --text: #eaeaea;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    font-family: 'Nunito', sans-serif;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 24px 12px;
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(233,69,96,0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(78,204,163,0.08) 0%, transparent 60%);
  }

  h1 {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(2rem, 6vw, 3.2rem);
    letter-spacing: 2px;
    color: var(--gold);
    text-shadow: 0 0 30px rgba(245,166,35,0.4);
    margin-bottom: 8px;
  }

  .scoreboard {
    display: flex;
    align-items: center;
    gap: 24px;
    background: var(--panel);
    border: 2px solid rgba(245,166,35,0.25);
    border-radius: 50px;
    padding: 10px 28px;
    margin-bottom: 24px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.3);
  }

  .score-label {
    font-size: 0.85rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: rgba(234,234,234,0.5);
  }

  .score-value {
    font-family: 'Fredoka One', cursive;
    font-size: 2rem;
    color: var(--gold);
    line-height: 1;
    min-width: 40px;
    text-align: center;
    transition: transform 0.2s;
  }

  .score-value.pop {
    animation: pop 0.3s ease;
  }

  @keyframes pop {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.5); color: var(--green); }
    100% { transform: scale(1); }
  }

  .divider {
    width: 2px;
    height: 32px;
    background: rgba(245,166,35,0.2);
    border-radius: 2px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    max-width: 460px;
    width: 100%;
  }

  .card {
    aspect-ratio: 3/4;
    border-radius: 14px;
    cursor: pointer;
    perspective: 800px;
    position: relative;
  }

  .card-inner {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius: 14px;
  }

  .card.flipped .card-inner,
  .card.matched .card-inner {
    transform: rotateY(180deg);
  }

  .card-face {
    position: absolute;
    inset: 0;
    border-radius: 14px;
    backface-visibility: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(1.6rem, 5vw, 2.2rem);
    user-select: none;
    box-shadow: 0 4px 16px rgba(0,0,0,0.35);
  }

  .card-back {
    background: var(--card-back);
    border: 2px solid rgba(78,204,163,0.2);
    background-image:
      repeating-linear-gradient(
        45deg,
        rgba(255,255,255,0.03) 0px,
        rgba(255,255,255,0.03) 2px,
        transparent 2px,
        transparent 12px
      );
  }

  .card-back::after {
    content: '?';
    font-family: 'Fredoka One', cursive;
    font-size: clamp(1.8rem, 5vw, 2.4rem);
    color: rgba(78,204,163,0.5);
    text-shadow: 0 0 10px rgba(78,204,163,0.3);
  }

  .card-front {
    background: var(--card-front);
    transform: rotateY(180deg);
    border: 3px solid transparent;
    transition: border-color 0.3s;
  }

  .card.matched .card-front {
    border-color: var(--green);
    background: #f0fff9;
    box-shadow: 0 0 18px rgba(78,204,163,0.4);
  }

  .card:not(.matched):not(.flipped):hover .card-inner {
    transform: rotateY(10deg) scale(1.04);
  }

  .card.matched {
    cursor: default;
    pointer-events: none;
  }

  /* Match burst animation */
  .card.matched .card-front::after {
    content: '✓';
    position: absolute;
    top: 4px;
    right: 7px;
    font-size: 0.9rem;
    color: var(--green);
    font-weight: 900;
  }

  /* Shake on mismatch */
  .card.shake .card-inner {
    animation: shake 0.45s ease;
  }

  @keyframes shake {
    0%   { transform: rotateY(180deg) translateX(0); }
    20%  { transform: rotateY(180deg) translateX(-6px); }
    40%  { transform: rotateY(180deg) translateX(6px); }
    60%  { transform: rotateY(180deg) translateX(-4px); }
    80%  { transform: rotateY(180deg) translateX(4px); }
    100% { transform: rotateY(180deg) translateX(0); }
  }

  .btn {
    margin-top: 28px;
    padding: 12px 36px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 50px;
    font-family: 'Fredoka One', cursive;
    font-size: 1.2rem;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(233,69,96,0.4);
    transition: transform 0.15s, box-shadow 0.15s;
  }

  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(233,69,96,0.5);
  }
  .btn:active { transform: translateY(0); }

  .win-banner {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    margin-bottom: 20px;
    animation: fadeIn 0.5s ease;
  }

  .win-banner.show { display: flex; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .win-banner .trophy {
    font-size: 3rem;
    animation: bounce 0.6s infinite alternate;
  }

  @keyframes bounce {
    from { transform: translateY(0); }
    to   { transform: translateY(-8px); }
  }

  .win-banner .msg {
    font-family: 'Fredoka One', cursive;
    font-size: 1.6rem;
    color: var(--gold);
    text-shadow: 0 0 20px rgba(245,166,35,0.4);
  }
</style>
</head>
<body>

<h1>🃏 Match It!</h1>

<div class="scoreboard">
  <div class="score-label">Pairs</div>
  <div class="score-value" id="score">0</div>
  <div class="divider"></div>
  <div class="score-label">Moves</div>
  <div class="score-value" id="moves">0</div>
</div>

<div class="win-banner" id="winBanner">
  <div class="trophy">🏆</div>
  <div class="msg">You matched them all!</div>
</div>

<div class="grid" id="grid"></div>

<button class="btn" onclick="initGame()">New Game</button>

<script>
  const EMOJIS = ['🐶','🐱','🐭','🐸','🦊','🐻','🦁','🐯'];
  let flipped = [], locked = false, score = 0, moves = 0, totalPairs = EMOJIS.length;

  function shuffle(arr) {
    return [...arr].sort(() => Math.random() - 0.5);
  }

  function initGame() {
    score = 0; moves = 0; flipped = []; locked = false;
    document.getElementById('score').textContent = '0';
    document.getElementById('moves').textContent = '0';
    document.getElementById('winBanner').classList.remove('show');

    const pairs = shuffle([...EMOJIS, ...EMOJIS]);
    const grid = document.getElementById('grid');
    grid.innerHTML = '';

    pairs.forEach((emoji, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.emoji = emoji;
      card.innerHTML = `
        <div class="card-inner">
          <div class="card-face card-back"></div>
          <div class="card-face card-front">${emoji}</div>
        </div>`;
      card.addEventListener('click', () => onCardClick(card));
      grid.appendChild(card);
    });
  }

  function onCardClick(card) {
    if (locked) return;
    if (card.classList.contains('flipped') || card.classList.contains('matched')) return;
    if (flipped.length >= 2) return;

    card.classList.add('flipped');
    flipped.push(card);

    if (flipped.length === 2) {
      locked = true;
      moves++;
      document.getElementById('moves').textContent = moves;
      checkMatch();
    }
  }

  function checkMatch() {
    const [a, b] = flipped;

    if (a.dataset.emoji === b.dataset.emoji) {
      // Match!
      score++;
      const scoreEl = document.getElementById('score');
      scoreEl.textContent = score;
      scoreEl.classList.remove('pop');
      void scoreEl.offsetWidth; // reflow
      scoreEl.classList.add('pop');

      setTimeout(() => {
        a.classList.add('matched');
        b.classList.add('matched');
        flipped = [];
        locked = false;
        if (score === totalPairs) {
          setTimeout(() => document.getElementById('winBanner').classList.add('show'), 300);
        }
      }, 300);

    } else {
      // No match — shake and flip back
      a.classList.add('shake');
      b.classList.add('shake');

      setTimeout(() => {
        a.classList.remove('flipped', 'shake');
        b.classList.remove('flipped', 'shake');
        flipped = [];
        locked = false;
      }, 900);
    }
  }

  initGame();
</script>
</body>
</html>
